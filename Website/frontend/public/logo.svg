<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092316" />
      <stop offset="100%" stop-color="#04120a" />
    </linearGradient>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" stroke="#064e3b" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Rover Ground Track -->
  <line x1="36" y1="78" x2="64" y2="78" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="35" cy="78" r="2.5" fill="#34d399" />
  <circle cx="65" cy="78" r="2.5" fill="#34d399" />
  <polygon points="50,71 45,78 55,78" fill="#064e3b" />

  <!-- Botanical Leaf Blade -->
  <path d="M50 14 C30 28, 26 54, 50 70 C74 54, 70 28, 50 14 Z" fill="url(#leafGrad)" />
  <path d="M50 14 C58 28, 62 52, 50 70 Z" fill="#10b981" opacity="0.45" />

  <!-- Central AI Neural Spine -->
  <line x1="50" y1="18" x2="50" y2="71" stroke="#04120a" stroke-width="2" stroke-linecap="round" />

  <!-- Circuit Traces & Nodes -->
  <line x1="50" y1="30" x2="38" y2="26" stroke="#04120a" stroke-width="1.4" />
  <circle cx="37" cy="25.5" r="1.8" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" />

  <line x1="50" y1="36" x2="62" y2="31" stroke="#04120a" stroke-width="1.4" />
  <circle cx="63" cy="30.5" r="1.8" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" />

  <line x1="50" y1="46" x2="35" y2="43" stroke="#04120a" stroke-width="1.4" />
  <circle cx="34" cy="42.5" r="1.8" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" />

  <line x1="50" y1="52" x2="64" y2="48" stroke="#04120a" stroke-width="1.4" />
  <circle cx="65" cy="47.5" r="1.8" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" />

  <line x1="50" y1="60" x2="40" y2="58" stroke="#04120a" stroke-width="1.4" />
  <circle cx="39" cy="57.5" r="1.8" fill="#f0fdf4" stroke="#059669" stroke-width="0.8" />

